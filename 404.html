  :root{--bg:#0a1016;--bg2:#0d151d;--panel-line:#1d2f3e;--grid:rgba(72,132,182,.09);
        --txt:#d7e3ec;--txt-dim:#8ba3b5;--cyan:#22c3e6;--cyan-dim:#1a8fad;--orange:#ff6b35;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--txt);font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.6;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:34px 34px;padding:24px;}
  .card{max-width:600px;background:var(--bg2);border:1px solid var(--panel-line);border-radius:6px;
        overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);}
  .bar{display:flex;align-items:center;gap:8px;background:#131f2a;padding:8px 12px;
       border-bottom:1px solid var(--panel-line);font-family:'JetBrains Mono',monospace;
       font-size:.68rem;color:var(--txt-dim);}
  .dot{width:9px;height:9px;border-radius:50%;}
  .dot.r{background:#e0564d;}.dot.y{background:#e0a53f;}.dot.g{background:#4fbf6b;}
  .body{padding:36px 34px;}
  .code{font-family:'JetBrains Mono',monospace;font-size:2.6rem;font-weight:700;color:var(--orange);
        line-height:1;margin-bottom:14px;}
  h1{font-size:1.45rem;margin:0 0 12px;letter-spacing:-0.01em;}
  p{color:var(--txt-dim);margin:0 0 12px;}
  .cmd{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--cyan);background:#0a1219;
       border:1px solid var(--panel-line);border-radius:3px;padding:10px 12px;margin:18px 0;}
  .cmd .dim{color:#5d7788;}
  .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
  a.btn{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.8rem;padding:12px 20px;
        border-radius:3px;text-decoration:none;color:var(--cyan);border:1.5px solid var(--cyan-dim);}
  a.btn:hover{border-color:var(--cyan);background:rgba(34,195,230,.08);}
